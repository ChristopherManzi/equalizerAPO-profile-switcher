name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run integration tests
        shell: powershell
        run: ./build.ps1 -Test
      - uses: actions/upload-artifact@v4
        with:
          name: EqualizerProfileSwitcher-windows
          path: artifacts/EqualizerProfileSwitcher.exe
